# backTraderTest crontab. The Windows CronRunner task ticks every minute
# (pythonw, no console) and runs enabled jobs whose cron matches now.
#
#   python scripts\pipeline\cron_manager.py list
#   python scripts\pipeline\cron_manager.py add NAME --schedule "0 23 * * 1-5" --command "crons\\foo.bat"
#   python scripts\pipeline\cron_manager.py enable NAME
#   python scripts\pipeline\cron_manager.py install-task

timezone: local
jobs:
- name: channel_touch_nightly
  enabled: true
  schedule: 0 23 * * 1-5
  command: crons\channel_touch_nightly.bat
  skip_if_ran_today: true
  description: Daily H2 resist-break after US cash close (default 23:00 local). Disable
    the old ChannelTouchNightly task before enabling this.
- name: channel_touch_15m
  enabled: true
  schedule:
  - 45 9 * * 1-5
  - 0,15,30,45 10-15 * * 1-5
  - 0 16 * * 1-5
  command: crons\channel_touch_15m.bat
  description: LIVE IB 15m on the armed/hot list only, every US RTH 15m close
    (client 8823). This is the /hot IB 15m fill feed. Do not confuse with
    overnight backfill_ib_15m_universe (full ~1478 names, client 8822).
  timezone: America/New_York
- name: channel_touch_15m_proximity
  enabled: true
  schedule:
  - 30-59 9 * * 1-5
  - '* 10-15 * * 1-5'
  - 0 16 * * 1-5
  command: crons\channel_touch_15m_proximity.bat
  description: Alpaca last on the armed 15m list every RTH minute. Dashboard source
    of truth; not a fill.
  timezone: America/New_York
- name: backfill_ib_15m_universe
  enabled: true
  schedule: 30 2 * * *
  command: crons\backfill_ib_15m_universe.bat
  description: Overnight catch-up of the FULL IB 15m universe (~1478 names,
    client 8822). Does not run during RTH and does not refresh the hot list.
    In-session IB hist is channel_touch_15m every 15m (client 8823).
