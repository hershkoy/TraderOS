# backTraderTest crontab. The Windows CronRunner task ticks every minute
# (pythonw, no console) and runs enabled jobs whose cron matches now.
#
#   python scripts\pipeline\cron_manager.py list
#   python scripts\pipeline\cron_manager.py add NAME --schedule "0 23 * * 1-5" --command "crons\\foo.bat"
#   python scripts\pipeline\cron_manager.py enable NAME
#   python scripts\pipeline\cron_manager.py install-task

timezone: local
jobs:
- name: channel_touch_nightly
  enabled: true
  schedule: 0 17 * * 1-5
  command: crons\channel_touch_nightly.bat
  description: Daily H2 resist-break after Alpaca 1d settles (17:00 ET Mon-Fri). Friday
    session close is the Friday 17:00 ET run. Do not fire at 16:00 ET cash close;
    Alpaca daily is often still the prior session then. If the job fails (including
    as_of still on the prior session), retry +1h, +2h, +3h. skip_if_ran_today skips
    those retries after a successful run. Disable the old ChannelTouchNightly task
    before enabling this.
  timezone: America/New_York
  skip_if_ran_today: true
  retry_hours:
  - 1
  - 2
  - 3
- name: channel_touch_15m
  enabled: true
  schedule:
  - 45 9 * * 1-5
  - 0,15,30,45 10-15 * * 1-5
  - 0 16 * * 1-5
  command: crons\channel_touch_15m.bat
  description: LIVE IB 15m on the armed/hot list only, every US RTH 15m close (client
    8826). This is the /hot IB 15m fill feed. After 16:30 ET after_rth_ib_backfill
    does full-universe 15m (8822) then 5m (8823). Hourly backfill_ib_5m_universe restarts
    5m if that job died. Stop 5m at 09:15 ET so this job owns Gateway.
  timezone: America/New_York
- name: channel_touch_15m_proximity
  enabled: true
  schedule:
  - 30-59 9 * * 1-5
  - '* 10-15 * * 1-5'
  - 0 16 * * 1-5
  command: crons\channel_touch_15m_proximity.bat
  description: Alpaca last on the armed 15m list every RTH minute. Dashboard source
    of truth; not a fill.
  timezone: America/New_York
- name: deep_pullback_spy
  enabled: true
  schedule:
  - 30-59 9 * * 1-5
  - '*/5 10-14 * * 1-5'
  - 0,5,10,15,20,25,30,35,40 15 * * 1-5
  - 45-59 15 * * 1-5
  - 0 16 * * 1-5
  command: crons\deep_pullback_spy.bat
  description: Deep Pullback SPY for /hot (timeframe=dp). Approaching Telegram in
    last 15m of RTH (15:45-16:00 ET) with MOC target; then minute SPY pulls keep
    current vs target on /hot (green=buy-ok). BUY NOW only from 15:57 if still
    at/below target. Uses DB 1d + Alpaca last. Every minute from 15:45; else ~5m.
  timezone: America/New_York
- name: qs_five_swing_spy
  enabled: true
  schedule:
  - 30-59 9 * * 1-5
  - '*/5 10-14 * * 1-5'
  - 0,5,10,15,20,25,30,35,40 15 * * 1-5
  - 45-59 15 * * 1-5
  - 0 16 * * 1-5
  command: crons\qs_five_swing_spy.bat
  description: QS Five-Swing SPY for /hot (timeframe=qs). Approaching from 15:45 with
    MOC target; minute SPY pulls keep current vs target (green=buy-ok). BUY NOW from
    15:57 if still at/below target. DB 1d + optional 1m + Alpaca last.
  timezone: America/New_York
- name: qqq_leaps_gap_live
  enabled: true
  schedule:
  - '*/1 8-9 * * 1-5'
  - 0-30 10 * * 1-5
  - '*/5 10-11 * * 1-5'
  command: crons\qqq_leaps_gap_live.bat
  description: QQQ LEAPS gap for /hot (timeframe=lg). Soft HOT/approaching when
    estimated gap nears -1% (strat1+SMA100) or -2% (strat2) in premarket/early RTH;
    BUY NOW when official open confirms. DB QQQ 1d + Alpaca last/open. Dense 08:00-10:30
    ET then every 5m to 11:00.
  timezone: America/New_York
- name: backfill_ib_15m_universe
  enabled: false
  schedule: 30 2 * * *
  command: crons\backfill_ib_15m_universe.bat
  description: Overnight catch-up of the FULL IB 15m universe (~1478 names, client
    8822). Disabled 2026-09-04; after_rth_ib_backfill at 16:30 ET does 15m then the 1d prefix (5m paused).
    Keep for manual `cron_manager.py run`. Live 15m is channel_touch_15m (client 8826).
- name: after_rth_ib_backfill
  enabled: true
  schedule: 30 16 * * 1-5
  command: crons\after_rth_ib_backfill.bat
  description: After US cash close (16:30 ET) catch up IB 15m (client 8822) then the
    IB 1d prefix to 2006-01-01 (client 8827) until the next weekday 09:15 ET. Friday
    runs through the weekend. Hourly backfill_ib_1d_prefix restarts 1d if this job
    died. 5m universe fill is paused until the 1d prefix is done. 1d Alpaca is
    channel_touch_nightly (17:00 ET). Do not run during RTH.
  timezone: America/New_York
- name: backfill_ib_5m_universe
  enabled: false
  schedule:
  - 0 17-23 * * 1-5
  - 0 0-8 * * 1-5
  - 0 * * * 0,6
  command: crons\backfill_ib_5m_universe.bat --skip-if-job-running after_rth_ib_backfill
    --reset-failed
  description: PAUSED 2026-10-26 while the 1d prefix to 2006 runs. Hourly 5m watchdog
    (client 8823) during backfill windows (weekends all hours; Mon-Fri 17:00-08:00 ET).
    Re-enable after ib_1d prefix dry-run reports no symbols left.
  timezone: America/New_York
- name: backfill_ib_1d_prefix
  enabled: true
  schedule:
  - 0 17-23 * * 1-5
  - 0 0-8 * * 1-5
  - 0 * * * 0,6
  command: crons\backfill_ib_1d_prefix.bat --skip-if-job-running after_rth_ib_backfill
  description: Hourly 1d prefix watchdog (client 8827, target 2006-01-01) during the
    same windows as the paused 5m job (weekends all hours; Mon-Fri 17:00-08:00 ET).
    Restarts if the 16:30 after_rth 1d process died. Skips if that job is still
    running or if the 1d pid lock is held. Stops itself at the next weekday 09:15 ET.
  timezone: America/New_York
- name: stop_ib_5m_backfill
  enabled: true
  schedule: 15 9 * * 1-5
  command: crons\stop_ib_5m_backfill.bat
  description: 09:15 ET Mon-Fri cooperative stop of the overnight IB fill (1d prefix
    now; 5m if it is still up) so live channel_touch_15m (client 8826) owns Gateway.
  timezone: America/New_York
