# backTraderTest crontab. The Windows CronRunner task ticks every minute
# (pythonw, no console) and runs enabled jobs whose cron matches now.
#
#   python scripts\pipeline\cron_manager.py list
#   python scripts\pipeline\cron_manager.py add NAME --schedule "0 23 * * 1-5" --command "crons\\foo.bat"
#   python scripts\pipeline\cron_manager.py enable NAME
#   python scripts\pipeline\cron_manager.py install-task

timezone: local
jobs:
- name: channel_touch_nightly
  enabled: true
  schedule: 0 23 * * 1-5
  command: crons\channel_touch_nightly.bat
  skip_if_ran_today: true
  description: Daily H2 resist-break after US cash close (default 23:00 local). Disable
    the old ChannelTouchNightly task before enabling this.
- name: channel_touch_15m
  enabled: true
  schedule:
  - 45 9 * * 1-5
  - 0,15,30,45 10-15 * * 1-5
  - 0 16 * * 1-5
  command: crons\channel_touch_15m.bat
  description: LIVE IB 15m on the armed/hot list only, every US RTH 15m close
    (client 8826). This is the /hot IB 15m fill feed. After 16:30 ET
    after_rth_ib_backfill does full-universe 15m (8822) then 5m (8823).
    Hourly backfill_ib_5m_universe restarts 5m if that job died.
    Stop 5m at 09:15 ET so this job owns Gateway.
  timezone: America/New_York
- name: channel_touch_15m_proximity
  enabled: true
  schedule:
  - 30-59 9 * * 1-5
  - '* 10-15 * * 1-5'
  - 0 16 * * 1-5
  command: crons\channel_touch_15m_proximity.bat
  description: Alpaca last on the armed 15m list every RTH minute. Dashboard source
    of truth; not a fill.
  timezone: America/New_York
- name: backfill_ib_15m_universe
  enabled: false
  schedule: 30 2 * * *
  command: crons\backfill_ib_15m_universe.bat
  description: Overnight catch-up of the FULL IB 15m universe (~1478 names,
    client 8822). Disabled 2026-09-04; after_rth_ib_backfill at 16:30 ET
    does 15m then 5m. Keep for manual `cron_manager.py run`. Live 15m is
    channel_touch_15m (client 8826).
- name: after_rth_ib_backfill
  enabled: true
  schedule: 30 16 * * 1-5
  command: crons\after_rth_ib_backfill.bat
  description: After US cash close (16:30 ET) catch up IB 15m (client 8822)
    then start IB 5m historical (client 8823) year-first (2025-through-now
    all symbols, then 2024..2020) until next weekday 09:15 ET.
    Friday runs through the weekend. Hourly backfill_ib_5m_universe
    restarts 5m if this job died. 1d Alpaca is channel_touch_nightly
    (local 23:00). Do not run during RTH.
  timezone: America/New_York
- name: backfill_ib_5m_universe
  enabled: true
  schedule:
  - 0 17-23 * * 1-5
  - 0 0-8 * * 1-5
  - 0 * * * 0,6
  command: crons\backfill_ib_5m_universe.bat --skip-if-job-running after_rth_ib_backfill --reset-failed
  description: Hourly 5m watchdog (client 8823) during backfill windows only
    (weekends all hours; Mon-Fri 17:00-08:00 ET, not RTH 09:15-16:30).
    Restarts if Friday's after_rth 5m died. Skips if that job is still
    running (separate lock) or if a live 5m pid lock is held. Clears the
    failed-symbol skip list on restart so Gateway drops are not permanent.
    Stale locks after reboot are ignored.
  timezone: America/New_York
- name: stop_ib_5m_backfill
  enabled: true
  schedule: 15 9 * * 1-5
  command: crons\stop_ib_5m_backfill.bat
  description: 09:15 ET Mon-Fri cooperative stop of 5m (stop file + kill)
    so live channel_touch_15m (client 8826) owns Gateway during RTH.
  timezone: America/New_York
